# ClawHub Publication Configuration
# 产业互联网硅基军团 - ClawHub 发布配置

name: industrial-silicon-army
version: 1.2.4
type: openclaw-skill
description: "塑化行业AI助手：20个专业Agent（采购/生产/销售/财务）开箱即用，支持真实场景验证与性能指标追踪"
emoji: "🏭"
homepage: https://cloudtrip.ai

# Publisher Info
publisher:
  name: "LookingPlas × 云旅智能体超市"
  website: "https://cloudtrip.ai"
  github: "https://github.com/cloudtrip-ai"
  contact: "support@cloudtrip.ai"

# Required Credentials
required_env:
  - OPENAI_API_KEY
  - LOOKINGPLAS_API_KEY
primary_env: OPENAI_API_KEY

# External APIs
apis:
  - name: OpenAI API
    url: https://api.openai.com
    purpose: "LLM大语言模型调用，用于Agent推理和内容生成"
  - name: LookingPlas API
    url: https://api.lookingplas.com
    purpose: "塑化行业数据接口，包括原料行情、供应商数据"
  - name: 1688 API
    url: https://gw.1688.com
    purpose: "1688采购平台数据同步，供应商比价"
  - name: Enterprise APIs
    url: https://api.lookingplas.com
    purpose: "企业数据源集成（可选，需企业版）"

