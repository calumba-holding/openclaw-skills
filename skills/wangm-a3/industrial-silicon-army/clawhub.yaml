      - "10个核心专业Agent"
      - "采购/生产/销售链路"
      - "基础数据看板"
      - "3个并发用户"
  professional:
    price: 999
    currency: CNY
    period: month
    features:
      - "全部20个Agent"
      - "全链路覆盖"
      - "API集成（ERP/MES/WMS/CRM）"
      - "15个并发用户"
      - "SLA 99.5%"
  enterprise:
    price: 9999
    currency: CNY
    period: month
    features:
      - "私有部署"
      - "行业定制"
      - "源码交付"
      - "专属顾问"

# Performance Metrics (v1.1.0 new)
performance:
  benchmarks:
    - metric: "报价响应时间"
      target: "<60s"
      actual: "28s"
    - metric: "方案准确率"
      target: "≥95%"
      actual: "96.5%"
    - metric: "多Agent协同成功率"
      target: "≥90%"
      actual: "94.2%"
    - metric: "路由准确率"
      target: "≥92%"
      actual: "96.1%"
    - metric: "报价采纳率"
      target: "≥70%"
      actual: "73.4%"
