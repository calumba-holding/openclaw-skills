name: skills-security-high-0-9

disable-default-queries: true

queries:
  - uses: security-extended

query-filters:
  - include:
      precision:
        - high
        - very-high
      tags contain: security
      security-severity: /([7-9]|10)\.(\d)+/
  # The skills repo is an untrusted archive, not one deployable app. Keep CodeQL focused on exploit-class
  # findings and avoid filling code scanning with generic hygiene warnings from examples and toy services.
  - exclude:
      id: js/clear-text-logging
  - exclude:
      id: js/double-escaping
  - exclude:
      id: js/incomplete-multi-character-sanitization
  - exclude:
      id: js/incomplete-sanitization
  - exclude:
      id: js/incomplete-url-substring-sanitization
  - exclude:
      id: js/missing-rate-limiting
  - exclude:
      id: js/polynomial-redos
  - exclude:
      id: py/clear-text-logging-sensitive-data
  - exclude:
      id: py/clear-text-storage-sensitive-data
  - exclude:
      id: py/incomplete-url-substring-sanitization
  - exclude:
      id: py/weak-sensitive-data-hashing
  - exclude:
      id: rust/cleartext-logging

paths:
  - skills/0*
  - skills/0*/**
  - skills/1*
  - skills/1*/**
  - skills/2*
  - skills/2*/**
  - skills/3*
  - skills/3*/**
  - skills/4*
  - skills/4*/**
  - skills/5*
  - skills/5*/**
  - skills/6*
  - skills/6*/**
  - skills/7*
  - skills/7*/**
  - skills/8*
  - skills/8*/**
  - skills/9*
  - skills/9*/**

paths-ignore:
  - "**/node_modules"
  - "**/node_modules/**"
  - "**/vendor"
  - "**/vendor/**"
  - "**/coverage"
  - "**/coverage/**"
  - "**/dist"
  - "**/dist/**"
  - "**/build"
  - "**/build/**"
  - "**/docs"
  - "**/docs/**"
  - "**/documentation"
  - "**/documentation/**"
  - "**/examples"
  - "**/examples/**"
  - "**/reference"
  - "**/reference/**"
  - "**/references"
  - "**/references/**"
  - "**/templates"
  - "**/templates/**"
  - "**/*.min.js"
  - "**/*.bundle.js"
  - "**/*.generated.*"
  - "**/*.test.*"
  - "**/*.spec.*"
  - "**/*fixture*"
  - "**/*mock*"
